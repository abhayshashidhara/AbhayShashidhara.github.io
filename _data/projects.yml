- title: "Evidence-Aware Hallucination Reduction for 3GPP RAN"
  description: "Built an evidence-aware RAG system for 3GPP TS 38.331 technical question answering. The pipeline combines BM25 retrieval, Qwen2.5 generation, DeBERTa-based NLI verification, and adaptive retrieval to reduce unsupported answers and improve reliability in telecom specification QA."
  image: "/images/projects/3gpp-rag.jpg"
  stack:
    - BM25
    - Qwen2.5
    - DeBERTa
    - NLI
    - 3GPP
  github_url: "https://github.com/abhayshashidhara/evidence-aware-3gpp-ran-qa"
  report_url: "https://sites.google.com/umn.edu/nlp-project/home?authuser=0"

- title: "Detecting Co-Travelers with Temporal Detailed People Proximity Graphs"
  description: "Spatial Data Science project for CSCI 8715. Proposed a Temporal Detailed People Proximity Graph TDPPG to detect repeated co-travel patterns from noisy Gowalla and Brightkite check-in data using spatiotemporal edge weighting, PyMetis node partitioning, and comparative graph evaluation."
  image: "/images/projects/tdppg-spatial.png"
  stack:
    - Python
    - Spatial Data Science
    - Graph Analytics
    - PyMetis
    - ROC-AUC
  github_url: "https://github.com/abhayshashidhara/tdppg-cotravel-detection"
  report_url: "/files/Spatial final report.pdf"

- title: "GoEmotions: Classical vs Pre-Trained ML Models"
  description: "Course project for CSCI 5523 Introduction to Data Mining. Built an emotion classification pipeline on the GoEmotions Reddit dataset, comparing classical ML approaches with transformer-based models."

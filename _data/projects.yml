- title: "CA-Bot: A PDF-Grounded Chatbot for CA Study"
  description: "Built a RAG-based chatbot that answers Chartered Accountancy questions strictly from prescribed textbooks stored as PDFs. Generated answers grounded in retrieved textbook passages and included citations to improve traceability and reduce unsupported statements."
  image: "/images/projects/chatbot.jpeg"
  stack:
    - RAG
    - PyMuPDF
    - Hugging Face Transformers
    - pandas
    - NLP
